<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Mario</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-wrapper">
      <h1>Flappy Mario</h1>
      <canvas id="game" width="480" height="640" aria-label="Игровое поле"></canvas>
      <div class="info">
        <p>Нажимайте пробел или кликайте мышью, чтобы прыгнуть. Избегайте труб!</p>
        <button id="restart">Играть снова</button>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
